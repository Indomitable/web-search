[package]
name = "web-search"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "query", "form"] }
scraper = "0.27.0"
unicode-width = "0.2.2"
url = "2.5.8"

[[bin]]
name = "ws"
path = "src/main.rs"
